default_install_hook_types:
  - pre-commit
  - pre-push

# A hook runs on commit unless it names its stages.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # These two name their own stages, which default_stages does not override.
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-toml
      - id: check-yaml
      - id: check-json

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: ["-s", "sh"]

  - repo: local
    hooks:
      # Also run when the manifest, lockfile or rustfmt config changes, not only on .rs files.
      - id: cargo-fmt
        name: Rust format check
        language: system
        entry: nix develop --command just fmt-check
        pass_filenames: false
        files: '\.rs$|^Cargo\.(toml|lock)$|^rustfmt\.toml$'

      - id: cargo-clippy
        name: Rust clippy
        language: system
        entry: nix develop --command just lint
        pass_filenames: false
        files: '\.rs$|^Cargo\.(toml|lock)$|^rustfmt\.toml$'

      - id: local-ci
        name: Local CI pipeline
        language: system
        entry: nix develop --command just pre-push
        pass_filenames: false
        always_run: true
        stages: [pre-push]
