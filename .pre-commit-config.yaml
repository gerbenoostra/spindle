default_install_hook_types:
  - pre-commit
  - pre-push
  - commit-msg

# A hook runs on commit unless it names its stages.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # These two name their own stages, which default_stages does not override.
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-toml
      - id: check-yaml
      - id: check-json

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: ["-s", "sh"]

  - repo: local
    hooks:
      # Also run when the manifest, lockfile or rustfmt config changes, not only on .rs files.
      - id: cargo-fmt
        name: Rust format check
        language: system
        entry: nix develop --command just fmt-check
        pass_filenames: false
        files: '\.rs$|^Cargo\.(toml|lock)$|^rustfmt\.toml$'

      - id: cargo-clippy
        name: Rust clippy
        language: system
        entry: nix develop --command just lint
        pass_filenames: false
        files: '\.rs$|^Cargo\.(toml|lock)$|^rustfmt\.toml$'

      - id: local-ci
        name: Local CI pipeline
        language: system
        entry: nix develop --command just pre-push
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # A commit-msg hook gets the message file as its only filename; pygrep
      # fails when the pattern matches. Covers co-authoring by an agent or any
      # bot, "Generated with/by" an agent name, and Cursor's "Made-with:"
      # trailer. Each alternative is anchored to the start of a line: prose
      # such as "transcripts generated by Claude" must pass, and so must the
      # diff `git commit -v` appends to the message file. A "Generated" line
      # must look like a trailer: a bracketed link, or the agent name ending
      # the line, optionally followed by "Code" or a model name and version,
      # then a "(url)" or "<url>". A wrapped body line "generated by Claude
      # from ..." passes. The agent list appears three times in the pattern:
      # keep the copies in sync.
      - id: no-agent-attribution
        name: No agent attribution in commit message
        language: pygrep
        entry: '(?i)^(co-authored-by:.*(devin|claude|anthropic|copilot|cursor|gemini|jules|aider|codex|codeium|windsurf|cognition|openai|\[bot\])|(🤖 ?)?generated (with|by) (\[(devin|claude|anthropic|copilot|cursor|gemini|jules|aider|codex|codeium|windsurf|cognition|openai)|(devin|claude|anthropic|copilot|cursor|gemini|jules|aider|codex|codeium|windsurf|cognition|openai)( code| (opus|sonnet|haiku|fable)( [0-9.]+)?)?( \(\S+\)| <\S+>)?[.!]?\s*$)|made-with: (cursor|devin|claude))'
        stages: [commit-msg]
