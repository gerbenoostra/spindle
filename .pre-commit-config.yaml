repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-yaml
      - id: check-json

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: ["-s", "sh"]

  - repo: local
    hooks:
      - id: cargo-fmt
        name: Rust format check
        language: system
        entry: nix develop --command just fmt-check
        pass_filenames: false
        types: [rust]

      - id: cargo-clippy
        name: Rust clippy
        language: system
        entry: nix develop --command just lint
        pass_filenames: false
        types: [rust]
