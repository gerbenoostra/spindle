version: 2
updates:
  # Third-party actions are pinned to a commit SHA with the version in a
  # trailing comment; this is what keeps those fresh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
