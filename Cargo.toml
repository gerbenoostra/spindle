[package]
name = "agent-sessions"
version = "0.0.2"
edition = "2024"
rust-version = "1.89"
description = "One dashboard for every agentic session and worktree"
repository = "https://github.com/gerbenoostra/spindle"
license = "MIT"
readme = "README.md"
keywords = ["agent", "session", "dashboard", "tmux", "worktree"]
categories = ["command-line-utilities"]

[dependencies]
crossterm = "0.29.0"
# `eq-separator`: pico-args ships with no features at all, so `--key=value` is
# not understood without it.
pico-args = { version = "0.5.0", features = ["eq-separator"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "=0.3.47", features = ["parsing"] }
# The authored config file is TOML; only its table access is used here.
toml = "1.1.6"
# Terminal cell widths for wrapping and truncation; ratatui already
# depends on it.
unicode-width = "0.2.2"

[profile.release]
strip = true
